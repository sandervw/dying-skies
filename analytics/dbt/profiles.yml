dying_skies_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('ANALYTICS_DB_HOST') }}"
      port: "{{ env_var('ANALYTICS_DB_PORT', '5432') | as_number }}"
      user: "{{ env_var('ANALYTICS_DB_USER') }}"
      password: "{{ env_var('ANALYTICS_DB_PASSWORD') }}"
      dbname: "{{ env_var('ANALYTICS_DB_NAME') }}"
      schema: "{{ env_var('ANALYTICS_DB_SCHEMA', 'analytics') }}"
      threads: 1
