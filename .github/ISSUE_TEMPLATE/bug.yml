name: Bug report
description: Something is broken, looks wrong, or sounds wrong.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a sky\n2. Click a falling star\n3. ..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 140 on Windows 11
  - type: input
    id: sky
    attributes:
      label: Sky address
      description: If it's about one sky, paste its address so it can be reproduced.
      placeholder: https://dyingskies.com/sky/...
